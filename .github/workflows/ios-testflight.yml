name: ios-testflight

# Manual only: builds ios-native/SmallTools and uploads the archive to
# TestFlight. Run from the Actions tab ("Run workflow") when you're ready to
# ship a build — this never fires automatically on push.
#
# Required repo secrets (App Store Connect API key, scoped to App Manager
# access on the fyi.imdaniel.smalltools.native app):
#   APP_STORE_CONNECT_KEY_ID      - the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID   - the API key's Issuer ID
#   APP_STORE_CONNECT_API_KEY_P8  - base64 of the downloaded AuthKey_*.p8 file
#                                   (e.g. `base64 -i AuthKey_XXXX.p8 | pbcopy`)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion override (defaults to the workflow run number)"
        required: false
        default: ""

jobs:
  build-and-upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-native/SmallTools
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        id: version
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project SmallTools.xcodeproj \
            -scheme SmallTools \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SmallTools.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=S26BJ6U5YF \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}"

      - name: Export IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmallTools.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/SmallTools.ipa
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
