name: ReelScraper
options:
  bundleIdPrefix: fyi.imdaniel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  ReelScraper:
    type: application
    platform: iOS
    sources:
      - ReelScraper
    info:
      path: ReelScraper/Info.plist
      properties:
        CFBundleDisplayName: Reel Scraper
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    entitlements:
      path: ReelScraper/ReelScraper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fyi.imdaniel.reelscraper
    dependencies:
      - target: ShareExtension
      - target: ReelScraperWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.imdaniel.reelscraper
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: S26BJ6U5YF
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - ReelScraper/Models
      - ReelScraper/Services
      - ReelScraper/LiveActivity/ScrapeActivityAttributes.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Reel Scraper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fyi.imdaniel.reelscraper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.imdaniel.reelscraper.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: S26BJ6U5YF
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: true
        INFOPLIST_KEY_CFBundleDisplayName: "Reel Scraper"

  ReelScraperWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - ReelScraperWidgetExtension
    info:
      path: ReelScraperWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Reel Scraper Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ReelScraperWidgetExtension/ReelScraperWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fyi.imdaniel.reelscraper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.imdaniel.reelscraper.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: S26BJ6U5YF
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: true
