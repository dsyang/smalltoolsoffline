name: SmallTools
options:
  bundleIdPrefix: fyi.imdaniel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  SmallTools:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - SmallTools
    info:
      path: SmallTools/Info.plist
      properties:
        CFBundleDisplayName: Offline Toolkit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: fyi.imdaniel.smalltools
            CFBundleURLSchemes:
              - smalltools
    dependencies:
      - target: SmallToolsWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.imdaniel.smalltools.native
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: S26BJ6U5YF
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

  SmallToolsWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SmallToolsWidgetExtension
      - CurrencyCore/Sources/CurrencyCore
    info:
      path: SmallToolsWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Currency Converter Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.imdaniel.smalltools.native.widget
        # Must equal the app's version. ci_post_clone.sh rewrites every MARKETING_VERSION line for APP_VERSION.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: S26BJ6U5YF
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: true
